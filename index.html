<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>萩椛 營運系統</title>
<style>
:root{--bg:#141414;--text:#E8E0D4;--muted:#8A8278;--line:#2E2E2E;--gold:#C8A96E;--bar:#0E0E0E}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text)}
body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

#home{min-height:100%;max-width:960px;margin:0 auto;padding:40px 20px 28px;display:flex;flex-direction:column}
.brand h1{font-family:"Songti TC","Noto Serif TC",serif;font-weight:900;font-size:clamp(2.4rem,9vw,3.4rem);margin:0;letter-spacing:.1em;color:var(--gold);line-height:1.1}
.brand p{margin:8px 0 0;color:var(--muted);font-size:.95rem}
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:40px}
.door{position:relative;border:none;text-align:left;padding:0;border-radius:4px;background:var(--c);color:#fff;
  min-height:280px;display:flex;flex-direction:column;overflow:hidden;transition:transform .15s}
.door::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;background:#000;opacity:.45}
.door:active{transform:scale(.98)}
.door .k{font-family:"Songti TC","Noto Serif TC",serif;font-weight:900;font-size:2rem;letter-spacing:.12em;writing-mode:vertical-rl;margin:40px auto 0;line-height:1}
.door .info{margin-top:auto;padding:16px;background:rgba(0,0,0,.2)}
.door .info b{display:block;font-size:1.05rem}
.door .info span{font-size:.82rem;opacity:.85}
.foot{margin-top:28px;color:var(--muted);font-size:.8rem;line-height:1.7}
@media (max-width:640px){
  .doors{grid-template-columns:1fr;margin-top:32px}
  .door{min-height:0;flex-direction:row;align-items:center}
  .door::before{width:8px;height:auto;bottom:0;right:auto}
  .door .k{writing-mode:horizontal-tb;font-size:1.6rem;margin:0;padding:24px 0 24px 26px;letter-spacing:.06em}
  .door .info{margin:0 0 0 auto;background:none;text-align:right}
}

#shell{display:none;height:100%;flex-direction:column}
#shell.on{display:flex}
.bar{display:flex;align-items:center;gap:4px;padding:4px 6px;background:var(--bar);border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.bar button{background:none;border:none;color:var(--muted);padding:7px 11px;border-radius:6px;white-space:nowrap;font-size:.85rem}
.bar .home{color:var(--gold);font-weight:700}
.bar .tab.on{background:var(--c);color:#fff}
.frames{flex:1;position:relative;overflow:auto;-webkit-overflow-scrolling:touch}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
.frames iframe.show{display:block}
@media (prefers-reduced-motion:reduce){.door{transition:none}}
</style>
</head>
<body>
<main id="home">
  <div class="brand"><h1>萩椛</h1><p>選擇要進入的系統</p></div>
  <nav class="doors" id="doors"></nav>
  <p class="foot">進入後可從上方列切換系統或返回入口。已開啟的系統在切換時會保留畫面與未存資料。</p>
</main>
<section id="shell"><div class="bar" id="bar"></div><div class="frames" id="frames"></div></section>

<script>
const SYSTEMS=[
  {id:'ops',k:'營運',name:'餐飲管理系統',desc:'排班・叫貨・廠商・檢查表',c:'#2A4A73'},
  {id:'material',k:'物料',name:'物料異常分析系統',desc:'進銷差異・月比・成本毛利',c:'#8A3B2E'},
  {id:'training',k:'訓練',name:'教育訓練管理系統',desc:'區域站點・訓練進度',c:'#3F5B3A'}
];
const $=id=>document.getElementById(id);
const urls={};
function srcUrl(id){
  if(urls[id]) return urls[id];
  const b64=$('src-'+id).textContent.trim();
  const bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return urls[id]=URL.createObjectURL(new Blob([bytes],{type:'text/html;charset=utf-8'}));
}
$('doors').innerHTML=SYSTEMS.map(s=>`<button class="door" style="--c:${s.c}" data-id="${s.id}">
  <span class="k">${s.k}</span><span class="info"><b>${s.name}</b><span>${s.desc}</span></span></button>`).join('');
$('doors').querySelectorAll('.door').forEach(b=>b.onclick=()=>go(b.dataset.id));

function renderBar(active){
  $('bar').innerHTML=`<button class="home" data-id="">← 入口</button>`+
    SYSTEMS.map(s=>`<button class="tab ${s.id===active?'on':''}" style="--c:${s.c}" data-id="${s.id}">${s.name}</button>`).join('');
  $('bar').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.id));
}
function go(id){ if(location.hash.slice(1)!==id) history.pushState(null,'',id?'#'+id:location.pathname+location.search); show(id); }
function show(id){
  const s=SYSTEMS.find(x=>x.id===id);
  if(!s){ $('shell').classList.remove('on'); $('home').style.display=''; document.title='萩椛 營運系統'; return; }
  $('home').style.display='none'; $('shell').classList.add('on'); renderBar(id); document.title=s.name;
  let f=$('f_'+id);
  if(!f){ f=document.createElement('iframe'); f.id='f_'+id; f.title=s.name;
    f.setAttribute('allow','clipboard-read; clipboard-write; camera; fullscreen');
    f.src=srcUrl(id); $('frames').appendChild(f); }
  document.querySelectorAll('#frames iframe').forEach(x=>x.classList.toggle('show',x===f));
}
window.addEventListener('popstate',()=>show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
</body>
